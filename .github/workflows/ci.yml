name: TurbineGuard CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    name: Lint, Test, Validate & Report
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Static Code Analysis & Linting (Ruff)
        run: |
          python -m ruff check src tests

      - name: Execute Unit Test Suite
        run: |
          python -m pytest -m unit -v

      - name: Execute Integration Test Suite
        run: |
          python -m pytest -m integration -v

      - name: Execute Safety & Fault-Tolerance Tests
        run: |
          python -m pytest -m "safety or fault" -v

      - name: Execute Complete Automated Validation Suite
        run: |
          python scripts/run_validation_suite.py

      - name: Upload Validation Reports & Artifacts
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: turbineguard-validation-reports
          path: |
            reports/validation_report.html
            reports/validation_report.pdf
            reports/validation_results.csv
            reports/validation_report.json
            reports/figures/

  docker-build:
    name: Build & Verify Docker Image
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: turbineguard:latest
