[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turbineguard"
version = "1.0.0"
description = "TurbineGuard: Wind Turbine Controller Validation & Automated Test Platform"
readme = "README.md"
authors = [
    { name = "Kumari Simran", email = "simran846@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "reportlab>=4.0.0",
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
turbineguard-demo = "scripts.demo_interview:main"
turbineguard-validate = "scripts.run_validation_suite:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Closed-loop and multi-component integration tests",
    "validation: Formal requirements verification suite",
    "safety: Critical safety limit and e-stop validation tests",
    "fault: Fault injection and fault tolerance tests",
]
